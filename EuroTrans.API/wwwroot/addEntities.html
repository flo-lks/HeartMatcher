<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Add Entities</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <h1>Add new Recipientpatient</h1>
    <form>
        <label for="firstname">First name:</label>
        <input type="text" id="firstname" name="firstname"><br>

        <label for="lastname">Last name:</label>
        <input type="text" id="lastname" name="lastname"><br>

        <label for="bloodtype">Bloodtype:</label>
        <input type="text" id="bloodtype" name="bloodtype"><br>

        <label for="bodyweight">Bodyweight:</label>
        <input type="text" id="bodyweight" name="bodyweight"><br>

        <label for="hospital">Hospital:</label>
        <select id="hospital" name="hospital">
            <option value="1">
                Charité Berlin
            </option>
            <option value="2">
                LMU-Klinikum München
            </option>
            <option value="3">
                Uniklinik Köln
            </option>
        </select><br>

        <input type="button" id="submitbutton" value="add" onclick="addPatient()">
    </form>

    <h1>Add new Donorheart</h1>

    <script src="js/script.js"></script>
</body>
</html>
